name: "ODOL Claude"
description: "Pro web-terminal met Claude Code: API-key login, HA-commands, back-ups, ha-mcp en fleet-tools"
version: "1.0.2"
slug: "odol_claude"
init: false

arch:
  - aarch64
  - amd64

url: "https://github.com/timsevenants/odol-claude"

ingress: true
ingress_port: 7681
panel_icon: mdi:robot-excited-outline
panel_title: "ODOL Claude"
panel_admin: true

ports:
  7681/tcp: null
ports_description:
  7681/tcp: "Web terminal (niet nodig bij ingress)"

options:
  auto_launch_claude: true
  anthropic_api_key: ""
  ha_smart_context: true
  enable_ha_mcp: true
  install_ha_commands: true
  backup_before_edit: true
  git_versioning: false
  install_ha_plugins: false
  persistent_apk_packages: []
  persistent_pip_packages: []

schema:
  auto_launch_claude: bool?
  anthropic_api_key: password?
  ha_smart_context: bool?
  enable_ha_mcp: bool?
  install_ha_commands: bool?
  backup_before_edit: bool?
  git_versioning: bool?
  install_ha_plugins: bool?
  persistent_apk_packages:
    - str
  persistent_pip_packages:
    - str

map:
  - config:rw

hassio_api: true
hassio_role: manager
homeassistant_api: true
auth_api: true

startup: services
webui: http://[HOST]:[PORT:7681]/
